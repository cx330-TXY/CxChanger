[save_variables]
filename: ~/printer_data/config/myvariables.cfg

#=================================================
# 开机恢复上一次记录的工具状态
#=================================================
[delayed_gcode RESTORE_TOOL_STATUS]
initial_duration: 0.1
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.current_tool is defined %}
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=current_tool VALUE={svv.current_tool}
        M118 [系统启动] 已恢复上一次的工具状态: T{svv.current_tool}
    {% else %}
        M118 [系统启动] 未找到历史工具状态，默认为无工具状态
    {% endif %}

#=================================================
# 【新增】开机自动禁用断料检测
# 说明：系统刚启动时，打印头上没有挂载任何工具头，
#       此时如果断料传感器处于触发状态会导致误报警。
#       因此在开机1秒后自动静默断料检测，
#       只有在成功换头后才会由 _VERIFY_TOOL_AND_ENABLE_SENSOR 宏重新开启。
#=================================================
[delayed_gcode DISABLE_SENSOR_ON_BOOT]
initial_duration: 1.0
gcode:
    # 强制关闭断料检测，避免启动时的误触发
    SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
    M118 [断料检测] 系统初始化完成，已默认静默断料检测（等待换头成功后自动开启）

#=================================================
# 【新增】断料与换头失败检测传感器配置
# 说明：此传感器同时承担两个职责：
#       1. 正常打印时的断料检测（Runout Detection）
#       2. 换头完成后的机械抓取确认（Tool Verification）
# 
# 硬件接线：将微动开关/断料检测器接在 expander:PA9 引脚（低电平触发）
# pause_on_runout: False
#   → 设为 False 是因为我们要在 runout_gcode 中自定义处理逻辑（如暂停、提示），
#     而不是让 Klipper 使用默认的暂停行为。
#=================================================
[filament_switch_sensor tool_sensor]
switch_pin: PC14      # 传感器引脚，"!" 表示低电平触发（常闭型开关需根据实际情况调整）
pause_on_runout: False         # 关闭 Klipper 默认的自动暂停，改用自定义 G-code 处理
runout_gcode:
    # 当打印过程中检测到耗材断开（或传感器弹开）时触发
    # 若功能开关已关闭，则忽略本次报警
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% if cfg.enable_sensor_check|int == 1 %}
        { action_respond_info("错误：打印中断料报警！已暂停打印。") }
        PAUSE
    {% else %}
        M118 [断料检测] 检测到断料信号，但功能已关闭，忽略本次报警
    {% endif %}
insert_gcode:
    # 当耗材重新插入（或传感器被压下）时触发
    { action_respond_info("耗材已插入，断料状态恢复。") }

#=================================================
# 1. 参数集中管理
#=================================================
[gcode_macro _toolchanger_cfg]
description: 工具切换参数配置

# --- 换刀抬升与速度与加速度 ---
variable_z_hop:            0    # 换头时Z轴的抬升高度 (mm)
variable_feed_z:           600    # Z轴抬升速度 (mm/min)
variable_feed_fast:        24000  # 快速空驶移动速度 (mm/min)
variable_feed_slow:        5000   # 受力/精准对齐时的慢速 (mm/min)
variable_accel_toolchange: 15000  # 换头期间的系统加速度 (防止动作过猛或太慢)
#variable_feed_fast:        18000  # 快速空驶移动速度 (mm/min)
#variable_feed_slow:        4000   # 受力/精准对齐时的慢速 (mm/min)
#variable_accel_toolchange: 5000  # 换头期间的系统加速度 (防止动作过猛或太慢)

# --- 换刀回抽/清洗配置 ---
variable_pickup_retract_len: 3.0  # [抓取工具] 夹紧后、离开停靠坞前回抽量 (mm)，防止去模型途中漏料 （！！！记得在切片软件换头回抽补偿那里额外挤出补偿相同长度！！！）
variable_swap_retract_len: 0      # [释放工具] 放回底座时的回抽量 (mm)，防止漏料
variable_swap_prime_len:   0      # [抓取工具] 抓取时的挤出量 (mm)，用于清洗或补偿
variable_swap_retract_spd: 2000   # 挤出/回抽的进给速度 (mm/min)

# --- 断料/换头失败检测开关 ---
# 1 = 开启：换头后验证抓取是否成功 + 打印中断料检测
# 0 = 关闭：跳过换头验证、不启用断料传感器（调试/无传感器时用）
variable_enable_sensor_check: 0

# ========================================================
# 【停靠坞运动逻辑参数】
# ========================================================
variable_dock_shift_x: -3    # X轴向横移距离：用于打开/闭合挤出机夹臂
variable_dock_dodge_y: 14    # Y轴向避让距离：避让动作的相对位移
variable_dock_safe_y:  30    # Y轴向安全距离：安全拔出停靠坞的相对位移

#---------------------------------------------------------
# 各热端绝对坐标配置 (根据你的实际物理位置调整)
#---------------------------------------------------------
# T0 配置 (停靠坞孔位核心坐标)
variable_t0_dock_x: 232      
variable_t0_dock_y: -20       

# T1 配置
variable_t1_dock_x: 202     
variable_t1_dock_y: -20

# T2 配置
variable_t2_dock_x: 172
variable_t2_dock_y: -20

# T3 配置
variable_t3_dock_x: 142
variable_t3_dock_y: -20
gcode:
    # 仅用于存储变量，不需要执行内容

#=================================================
# 2. 切换热端命令 (用户级指令)
#=================================================
[gcode_macro T0]
gcode: change_tool T=0

[gcode_macro T1]
gcode: change_tool T=1

[gcode_macro T2]
gcode: change_tool T=2

[gcode_macro T3]
gcode: change_tool T=3

[gcode_macro UNTOOL]
description: 卸载当前热端，变为空载状态
gcode: change_tool T=-1

#=================================================
# 3. 状态变量存储 (运行时记录)
#=================================================
[gcode_macro _tool_status]
variable_current_tool: -1
gcode:

#=================================================
# 4. 释放热端动作 (底层动作宏)
#=================================================
[gcode_macro _release_tool]
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set tool = params.TOOL|int %}
    {% set prefix = "t" ~ tool %}
    {% set active_extruder = printer.toolhead.extruder %}
    
    # 提取当前喷头的停靠参数
    {% set dock_x = cfg[prefix + "_dock_x"] %}
    {% set dock_y = cfg[prefix + "_dock_y"] %}
    {% set shift_x = cfg.dock_shift_x %}
    {% set dodge_y = cfg.dock_dodge_y %}
    {% set safe_y  = cfg.dock_safe_y %}

    M118 --- [T{tool} 释放] 启动释放流程...

    # --- [A] 释放回抽 (防止底座溢料) ---
    {% set cur_temp = printer[active_extruder].temperature|float %}
    {% set min_temp = printer.configfile.settings[active_extruder].min_extrude_temp|default(170)|float %}
    
    {% if cur_temp >= min_temp %}
       M118 --- [T{tool} 释放] 温度达标，正在执行释放前回抽...
       M83  
       G1 E-{cfg.swap_retract_len} F{cfg.swap_retract_spd} 
    {% else %}
       M118 --- [T{tool} 释放] 当前温度({cur_temp}℃)过低，跳过回抽操作
    {% endif %}

    # --- 开始释放物理动作 ---
    G90 
    
    M118 --- [T{tool} 释放] 步骤1: 移动到停靠坞前方安全入口
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}
    
    M118 --- [T{tool} 释放] 步骤2: 直线推入停靠坞底座
    G0 X{dock_x} Y{dock_y} F{cfg.feed_fast}
    
    M118 --- [T{tool} 释放] 步骤3: X轴横移，打开挤出机摆臂
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow}
    
    M118 --- [T{tool} 释放] 步骤4: Y轴拔出，断开工具磁吸
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow}
    
    M118 --- [T{tool} 释放] 步骤5: 反向横移，安全闭合挤出机摆臂
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_slow}
    
    M118 --- [T{tool} 释放] 步骤6: 退回安全入口，释放完成
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}

#=================================================
# 5. 抓取热端动作 (底层动作宏)
#=================================================
[gcode_macro _pickup_tool]
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set tool = params.TOOL|int %}
    {% set prefix = "t" ~ tool %}
    {% set current_heater = "extruder" if tool == 0 else ("extruder" ~ tool) %}
    
    {% set dock_x = cfg[prefix + "_dock_x"] %}
    {% set dock_y = cfg[prefix + "_dock_y"] %}
    {% set shift_x = cfg.dock_shift_x %}
    {% set dodge_y = cfg.dock_dodge_y %}
    {% set safe_y  = cfg.dock_safe_y %}

    M118 +++ [T{tool} 抓取] 启动抓取流程...
    
    # --- 开始抓取物理动作 ---
    G90
    
    M118 +++ [T{tool} 抓取] 步骤1: 移动到停靠坞前方安全入口
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}
    
    M118 +++ [T{tool} 抓取] 步骤2: 进入避让位置 (避免撞到停靠的热端)
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_fast}
    
    M118 +++ [T{tool} 抓取] 步骤3: X轴横移，准备切入
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow}
    
    M118 +++ [T{tool} 抓取] 步骤4: 推入底座，磁吸结合
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow}
    
    M118 +++ [T{tool} 抓取] 步骤5: 反向横移，夹紧耗材丝
    G0 X{dock_x} Y{dock_y} F{cfg.feed_slow}
    
    # --- 停靠坞内挤出补偿 ---
    {% set cur_temp = printer[current_heater].temperature|float %}
    {% set min_temp = printer.configfile.settings[current_heater].min_extrude_temp|default(170)|float %}
    
    {% if cur_temp >= min_temp %}
         M118 +++ [T{tool} 抓取] 温度达标，正在执行抓取补偿挤出...
         M83 
         G1 E{cfg.swap_prime_len} F{cfg.swap_retract_spd} 
    {% else %}
         M118 +++ [T{tool} 抓取] 当前温度({cur_temp}℃)过低，跳过补偿挤出
    {% endif %}

    # --- [新增] 夹紧后回抽，防止离开停靠坞到模型途中漏料 ---
    {% if cur_temp >= min_temp and cfg.pickup_retract_len > 0 %}
     M118 +++ [T{tool} 抓取] 执行抓取后回抽 {cfg.pickup_retract_len}mm，防止途中漏料...
     M83
     G1 E-{cfg.pickup_retract_len} F{cfg.swap_retract_spd}
    {% endif %}

    M118 +++ [T{tool} 抓取] 步骤6: 带着工具退回安全入口，抓取完成
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}
    
#=================================================
# 【新增】6. 换头结果验证与断料检测控制宏
# 
# 功能说明：
#   此宏在换头流程的最后一步被调用，用于：
#   1. 验证换头是否成功：通过读取微动开关/断料传感器的状态，
#      判断打印头是否确实抓到了新工具（传感器被耗材压下 = 正常）。
#   2. 管理断料检测：验证通过后，自动开启断料传感器监控；
#      若验证失败（传感器未触发），则判定为换头失败或新喷头无耗材，
#      立即暂停打印，防止空打损坏模型或喷头。
# 
# 调用时机：
#   仅在 change_tool 宏完成所有物理抓取动作后调用。
#   如果 new_tool == -1（卸载状态），则不调用此宏。
#=================================================
[gcode_macro _VERIFY_TOOL_AND_ENABLE_SENSOR]
description: 验证换头并处理结果
gcode:
    {% set new_tool = params.NEW_TOOL|int %}
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set sensor_on = cfg.enable_sensor_check|int %}

    # 若用户已关闭传感器检测，则跳过验证，直接记为成功并保持传感器关闭
    {% if sensor_on == 0 %}
        M118 [换头验证] 传感器检测已关闭，跳过抓取验证与断料监控。
        SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
        {% set svv = printer.save_variables.variables %}
        {% set total_changes = svv.total_tool_changes | default(0) | int + 1 %}
        SAVE_VARIABLE VARIABLE=total_tool_changes VALUE={total_changes}
        SAVE_VARIABLE VARIABLE=current_tool VALUE={new_tool}
        M118 [换头调度] 换头手续已完整办结（检测关闭）。当前累计换头总次数: {total_changes}次
    {% else %}
        {% set has_filament = printer["filament_switch_sensor tool_sensor"].filament_detected %}
        
        {% if has_filament %}
            # ------- 场景：成功 -------
            M118 [换头验证] 传感器状态正常，换头成功。
            SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=1
            
            {% set svv = printer.save_variables.variables %}
            {% set total_changes = svv.total_tool_changes | default(0) | int + 1 %}
            SAVE_VARIABLE VARIABLE=total_tool_changes VALUE={total_changes}
            SAVE_VARIABLE VARIABLE=current_tool VALUE={new_tool}
            M118 [换头调度] 换头手续已完整办结。当前累计换头总次数: {total_changes}次
            
        {% else %}
            # ------- 场景：失败 -------
            M118 [换头验证] !!! 警告：未检测到耗材，请检查抓取情况 !!!
            { action_respond_info("换头可能失败或无耗材，系统已执行暂停。检查完毕后请手动点击恢复。") }
            PAUSE
        {% endif %}
    {% endif %}
#=================================================
# 7. 主切换宏 (核心调度中枢)
#=================================================
[gcode_macro change_tool]
gcode:
    {% set new_tool = params.T|default(-1)|int %}
    {% set old_tool = printer["gcode_macro _tool_status"].current_tool|int %}
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}

    {% if new_tool == old_tool %}
        M118 [换头调度] 目标工具与当前一致 (T{new_tool})，无需执行任何动作
    {% else %}
        {% if new_tool == -1 %}
            M118 [换头调度] 收到卸载指令，准备将 T{old_tool} 放回停靠坞...
        {% else %}
            M118 [换头调度] 开始执行换头: 从 T{old_tool} 切换至 T{new_tool}
        {% endif %}

        # 1. 保存当前状态
        M118 [换头调度] 保存换头前坐标状态，并调整为换头专用加速度...
        SAVE_GCODE_STATE NAME=tool_change
        {% set saved_accel = printer.toolhead.max_accel %}
        SET_VELOCITY_LIMIT ACCEL={cfg.accel_toolchange}
        
        # ============================================================
        # 【新增】换头前屏蔽断料检测
        # 原因：换头过程中打印头会离开模型区域，耗材会被回抽/挤出，
        #       传感器状态在此期间不稳定，必须暂时关闭监控，
        #       避免在换头中途误触发断料报警。
        # ============================================================
        M118 [换头调度] 换头前临时关闭断料检测，避免换头动作干扰...
        SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
        
        # 2. 抬升Z轴
        M118 [换头调度] 相对抬升Z轴 {cfg.z_hop}mm...
        G91
        G0 Z{cfg.z_hop} F{cfg.feed_z}
        G90
        
        # 3. 清除坐标偏移
        M118 [换头调度] 临时清空坐标偏移量，采用绝对机械坐标寻址...
        SET_GCODE_OFFSET X=0 Y=0 Z=0

        # 4. 释放旧工具
        {% if old_tool != -1 %}
            _release_tool TOOL={old_tool}
        {% else %}
            M118 [换头调度] 当前属于空载状态，跳过释放步骤
        {% endif %}

        # 5. 抓取新工具
        {% if new_tool != -1 %}
            {% set next_heater = "extruder" if new_tool == 0 else ("extruder" ~ new_tool) %}
            {% set target_temp = printer[next_heater].target|float %}
            
            # 温度检查与等待
            {% if target_temp > 0 %}
                {% if printer[next_heater].temperature < (target_temp - 2) %}
                    M118 [换头调度] T{new_tool} 温度未达标，等待加热至 {target_temp}℃...
                    TEMPERATURE_WAIT SENSOR={next_heater} MINIMUM={target_temp}
                {% endif %}
            {% endif %}

            _pickup_tool TOOL={new_tool}
        {% else %}
            M118 [换头调度] 目标为卸载状态(-1)，不再抓取新工具
        {% endif %}

        # 6. 更新内存状态
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=current_tool VALUE={new_tool}

        # 7. 恢复原位与加速度
        M118 [换头调度] 恢复到换头前的物理坐标与打印系统加速度...
        RESTORE_GCODE_STATE NAME=tool_change MOVE=0 
        SET_VELOCITY_LIMIT ACCEL={saved_accel}

         # 8. 读取并应用新工具偏移
        {% set svv = printer.save_variables.variables %}
        {% if new_tool != -1 %}
            {% set off_x = svv["t" ~ new_tool ~ "_offset_x"] | default(0.0) | float %}
            {% set off_y = svv["t" ~ new_tool ~ "_offset_y"] | default(0.0) | float %}
            {% set off_z = svv["t" ~ new_tool ~ "_offset_z"] | default(0.0) | float %}
            SET_GCODE_OFFSET X={off_x} Y={off_y} Z={off_z} MOVE=0
            M118 [换头调度] 加载 T{new_tool} 偏移: X={off_x} Y={off_y} Z={off_z}
        {% endif %}

        # 9. 执行验证 (重点：将 new_tool 传给它)
        {% if new_tool != -1 %}
            M118 [换头调度] 等待机械停止，准备验证...  
            #M400 
            _VERIFY_TOOL_AND_ENABLE_SENSOR NEW_TOOL={new_tool}
        {% else %}
            # 如果是卸载工具(T=-1)，直接更新状态即可
            SAVE_VARIABLE VARIABLE=current_tool VALUE=-1
            M118 [换头调度] 工具已成功卸载，当前为空载状态。
        {% endif %}

    {% endif %}

#=================================================
# 8. 换头计数管理工具 (用户可调用指令)
#=================================================
[gcode_macro GET_TOOL_CHANGE_COUNT]
description: 查询当前累计的换头总次数
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set total_changes = svv.total_tool_changes | default(0) | int %}
    M118 [换头统计] 当前累计换头总次数为: {total_changes} 次

[gcode_macro RESET_TOOL_CHANGE_COUNT]
description: 重置总换头次数计数器为0
gcode:
    SAVE_VARIABLE VARIABLE=total_tool_changes VALUE=0
    M118 [换头统计] 历史总换头次数已成功重置为 0

#=================================================
# 8.5 断料检测 / 换头失败检测 开关
#=================================================
# 关闭后：换头不验证、不暂停；断料传感器保持关闭，打印中不报警
# 开机默认跟随 enable_sensor_check（默认1=开启）
#=================================================
[gcode_macro DISABLE_TOOL_SENSOR]
description: 关闭换头失败检测与断料检测
gcode:
    SET_GCODE_VARIABLE MACRO=_toolchanger_cfg VARIABLE=enable_sensor_check VALUE=0
    SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
    M118 [断料检测] 已关闭：换头验证 + 断料报警均已禁用

[gcode_macro ENABLE_TOOL_SENSOR]
description: 开启换头失败检测与断料检测
gcode:
    SET_GCODE_VARIABLE MACRO=_toolchanger_cfg VARIABLE=enable_sensor_check VALUE=1
    {% set cur = printer["gcode_macro _tool_status"].current_tool|int %}
    {% if cur != -1 %}
        SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=1
        M118 [断料检测] 已开启：换头验证 + 断料报警（当前已挂载 T{cur}，传感器已激活）
    {% else %}
        SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
        M118 [断料检测] 已开启：换头验证 + 断料报警（当前空载，传感器暂不激活，换头成功后自动开启）
    {% endif %}

[gcode_macro GET_TOOL_SENSOR_STATUS]
description: 查询当前断料/换头检测开关状态
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set on = cfg.enable_sensor_check|int %}
    {% set sensor_enabled = printer["filament_switch_sensor tool_sensor"].enabled %}
    {% set has_filament = printer["filament_switch_sensor tool_sensor"].filament_detected %}
    {% if on == 1 %}
        M118 [断料检测] 功能开关: 开启 | 传感器实际状态: {"已激活" if sensor_enabled else "未激活"} | 当前是否检测到耗材: {"是" if has_filament else "否"}
    {% else %}
        M118 [断料检测] 功能开关: 关闭（换头不验证、打印不报警） | 传感器实际状态: {"已激活" if sensor_enabled else "未激活"}
    {% endif %}

#=================================================
# 9. 接管 M109 (加热并等待)
#=================================================
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|default(0)|float %}
    {% set r = params.R|default(0)|float %}
    {% set target_temp = s if s > 0 else r %}
    {% set tool_index = params.T|default(-1)|int %}
    {% set sensor_name = printer.toolhead.extruder %}

    # 修复：确保调用正确的宏变量名称 current_tool
    {% if tool_index == -1 %}
        {% set current_tool = printer["gcode_macro _tool_status"].current_tool|int %}
        {% set tool_index = current_tool %}
        M118 [M109 加热] 未指定T参数，默认加热当前挂载工具头: T{current_tool}
    {% endif %}

    {% if tool_index != -1 %}
        {% if tool_index == 0 %}
            {% set sensor_name = "extruder" %}
        {% else %}
            {% set sensor_name = "extruder" ~ tool_index %}
        {% endif %}
    {% endif %}

    {% if target_temp > 0 %}
        M118 [M109 加热] 开始将 {sensor_name} 加热至 {target_temp}℃，并等待稳定...
        {% if tool_index != -1 %}
            M104 S{target_temp} T{tool_index}
        {% else %}
            M104 S{target_temp}
        {% endif %}
        TEMPERATURE_WAIT SENSOR={sensor_name} MINIMUM={target_temp - 1.0}
        M118 [M109 加热] 温度已达标！
    {% endif %}