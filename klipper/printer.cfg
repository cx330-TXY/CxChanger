[virtual_sdcard]
path: /usr/share/printer_data/gcodes

[pause_resume]

[display_status]

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  G91
  G1 Z10 F600 ; 抬高喷嘴10mm避免烫坏模型
  UNTOOL
  M106 S0
[force_move]
enable_force_move: True
#####################################################################
#                               文件调用                               #
#####################################################################
[include toolchange.cfg]
[include calibration.cfg]
#[include idm.cfg]
#####################################################################
#                               主板配置                               #
#####################################################################
[mcu]
serial:/dev/serial/by-id/usb-Klipper_stm32f407xx_37001E001650334636343620-if00



#[mcu host]
#serial: /tmp/klipper_host_mcu

#####################################################################
#                            副板扩展配置                             #
#####################################################################
#[mcu expander]
# 这里填入你在第一步获取到的新主板ID
#serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_3F0035000357465036383420-if00 
#####################################################################
#                            机型和加速度                            #
#####################################################################
[printer]                       # 打印机设置
kinematics: corexy              # 运动学结构分为：笛卡尔和corexy等等。笛卡尔：cartesian
max_velocity: 400               # 打印机最大速度   
max_accel: 20000                 # 最大加速度 
max_z_velocity: 30              # z轴最大速度
max_z_accel: 300                # z轴最大加速度
square_corner_velocity: 5.0     # 方形拐角速度，小一点可以有效避免平台重带来的惯性
#####################################################################
#                             温度监控                               #
#####################################################################
[temperature_sensor MCU]    
sensor_type: temperature_mcu   

[temperature_sensor FLY-Pi]
sensor_type: temperature_host
#####################################################################
#             X/Y步进电机设置 (X/Y Stepper Settings)                 # 
#####################################################################
#   B Motor ---- Motor A 
#   |                  |
#   |------挤出机-------|
#   |                  |
#   |                  |
#          正前方   
#####################################################################
#                          X 轴步进电机   (B 电机)                    #
#####################################################################
## X电机口
[stepper_x]
step_pin: PB9                       # X轴电机脉冲引脚设置
dir_pin: PE0                        # X轴电机运行引脚设置,方向按实际判断,加感叹号会让运行方向反转
enable_pin: !PE1                    # X轴电机使能引脚设置,使能引脚需要加感叹号,否则电机不工作
rotation_distance: 40               # 主动带轮周长mm(2GT-20T带轮40,2GT-16T带轮32)
microsteps: 32                      # 电机细分设置,细分越高,质量越高,但主控负荷越大
full_steps_per_rotation: 200        # 电机单圈所需脉冲数(1.8度电机:200,0.9度电机:400)
endstop_pin: PF1                   # 限位开关PIN脚,建议常闭然后添加!反转状态,位置在io-3
###接常闭后是触发状态,加感叹号可以反转这个状态,万一断线时可以避免撞机
position_min: -5                     # 软限位最小行程
position_endstop: 240               # 软限位最大行程 (250mm-300mm-350mm)
position_max: 240                   # 机械限位最大行程 (250mm-300mm-350mm)
homing_speed: 80                    # 复位速度,最大为100.归位速度建议别太快
homing_retract_dist: 5              # 第一次触发复位开关之后的后退距离
#--------------------------------------------------------------------
##  请确保驱动型号配置正确 (2208 or 2209)
[tmc2209 stepper_x]                 # X 驱动配置 -TMC2209
uart_pin: PG13                      # 通讯端口Pin脚定义
interpolate: False                  # 是否开启256微步插值(开启是True,关闭是False)
run_current: 1.2                    # 运行电流
sense_resistor: 0.110               # 驱动采样电阻不要改
#####################################################################
#                       y 轴步进电机   (A 电机)                       #
#####################################################################
## Y电机口
[stepper_y]
step_pin: PB8                       # Y轴电机脉冲引脚设置
dir_pin: PG11                       # Y轴电机运行引脚设置,方向按实际判断,加感叹号会让运行方向反转
enable_pin: !PG12                   # Y轴电机使能引脚设置,使能引脚需要加感叹号,否则电机不工作
rotation_distance: 40               # 主动带轮周长mm(2GT-20T带轮40,2GT-16T带轮32)
microsteps: 32                      # 电机细分设置,细分越高,质量越高,但主控负荷越大
full_steps_per_rotation: 200        # 电机单圈所需脉冲数(1.8度电机:200,0.9度电机:400)
endstop_pin: PC2                   # 限位开关PIN脚,建议常闭然后添加!反转状态,位置在io-0
###接常闭后是触发状态,加感叹号可以反转这个状态,万一断线时可以避免撞机
position_min: -33                     # 软限位最小行程
position_endstop: 230               # 软限位最大行程 (250mm-300mm-350mm)
position_max: 230                   # 机械限位最大行程 (250mm-300mm-350mm)
homing_speed: 80                    # 复位速度,最大为100        归位速度建议别太快
homing_retract_dist: 5              # 第一次触发复位开关之后的后退距离
#--------------------------------------------------------------------
##  请确保驱动型号配置正确 (2208 or 2209)
[tmc2209 stepper_y]                 # Y驱动配置 -TMC2209
uart_pin: PG10                      # 通讯端口Pin脚定义
interpolate: False                  # 是否开启256微步插值(开启是True,关闭是False)
run_current: 1.2                    # 运行电流
sense_resistor: 0.110               # 驱动采样电阻不要改
#--------------------------------------------------------------------
#[tmc5160 stepper_y]                 # 挤出机驱动配置- TMC5160
#cs_pin: PG10                        # SPI 片选Pin脚定义
#spi_bus: spi2                      # SPI 通讯总线定义
#run_current: 1.0                    # 电机运行电流值
#interpolate: False                  # 是否开启256微步插值(开启是True,关闭是False)
#sense_resistor: 0.075              # 驱动采样电阻不要改(如果使用5160 Pro,请将数值修改为0.033)

#####################################################################
#                     Z轴步进电机 (Z Stepper Settings)              #
#####################################################################
#   |----- Z1 -----|
#   |              |
#   |              |
#   |              |
#   Z0----显示屏----Z2

#####################################################################
#                           Z轴步进电机                              #
#####################################################################
##    Z步进电机 - 左前方 z接口

[stepper_z]
step_pin: PC6                 # z轴电机脉冲引脚设置
dir_pin:  !PA15                 # z轴电机方向引脚设置,方向引脚需要按实际判断，加感叹号会让运行方向反转
enable_pin: !PD0              # z轴电机使能引脚设置,使能引脚需要加感叹号，否者电机不工作
rotation_distance: 8          # 丝杆导程为 8，请根据你的实际使用情况修改，总共需要修改3处
full_steps_per_rotation: 200  # 电机单圈所需脉冲数（1.8度电机:200，0.9度电机:400)
microsteps: 32                # 电机细分设置,细分越高，质量越高，但主控负荷越大
endstop_pin: probe:z_virtual_endstop            # 限位开关PIN脚,建议常闭然后添加！反转状态,位置在io-1
position_min: -10             # Z轴的最小行程（配置喷嘴清洁需要-5左右）
position_max: 200             # Z轴的最大行程 (250mm-300mm-350mm)
homing_speed: 10               # 复位速度-最大 20
second_homing_speed: 3        # 二次复位速度-最大 10
homing_retract_dist: 3        # 后撤距离
#--------------------------------------------------------------------
[tmc2208 stepper_z]
uart_pin: PA14                 # 驱动通信端口
interpolate: false            # 微步插值256
run_current: 0.8              # 运行电流mA
sense_resistor: 0.110         # 驱动采样电阻不要改
#stealthchop_threshold: 800    # 静音阀值（如果不需要静音，请将数值改为0）
#--------------------------------------------------------------------
##    Z1 步进电机 - 后方
[stepper_z1]
step_pin: PC7               # z1轴电机脉冲引脚设置
dir_pin:  !PD3               # z1轴电机方向引脚设置,方向引脚需要按实际判断，加感叹号会让运行方向反转
enable_pin: !PD4              # z1轴电机使能引脚设置,使能引脚需要加感叹号，否者电机不工作
rotation_distance: 8          # 丝杆导程为 8
full_steps_per_rotation: 200  # 电机单圈所需脉冲数（1.8度电机:200，0.9度电机:400
microsteps: 32                # 电机细分设置,细分越高，质量越高，但主控负荷越大
#--------------------------------------------------------------------
[tmc2208 stepper_z1]
uart_pin: PD1              # 驱动通信端口
interpolate: false            # 微步插值256
run_current: 0.8              # 运行电流mA
sense_resistor: 0.110         # 驱动采样电阻不要改
#stealthchop_threshold: 800    # 静音阀值（如果不需要静音，请将数值改为0）
#--------------------------------------------------------------------
##    Z2 步进电机 - 右前方
[stepper_z2]
step_pin: PA8                 # z2轴电机脉冲引脚设置
dir_pin: !PD6              # z2轴电机方向引脚设置,方向引脚需要按实际判断，加感叹号会让运行方向反转
enable_pin: !PD7             # z2轴电机使能引脚设置,使能引脚需要加感叹号，否者电机不工作
rotation_distance: 8          # 丝杆导程为 8
full_steps_per_rotation: 200  # 电机单圈所需脉冲数（1.8度电机:200，0.9度电机:400
microsteps: 32                # 电机细分设置,细分越高，质量越高，但主控负荷越大
#--------------------------------------------------------------------
[tmc2208 stepper_z2]
uart_pin: PD5                # 驱动通信端口
interpolate: false            # 微步插值256
run_current: 0.8              # 运行电流mA
sense_resistor: 0.110         # 驱动采样电阻不要改
#stealthchop_threshold: 800    # 静音阀值（如果不需要静音，请将数值改为0）
#####################################################################
#                     E0 挤出机设置 （E0 Settings）                   # 
#####################################################################

[extruder]                          
step_pin: PD15                       # 挤出电机方脉冲引脚
dir_pin: PG7                       # 挤出电机方向引脚设置
enable_pin: !PG8                   # 挤出电机方使能引脚设置
rotation_distance: 55               # 步进值
gear_ratio: 44:10, 37:17            # 减速比（伽利略齿比7.5:1 并且这行注释掉；BMG为50：17，输出轴在前，输入轴在后）
microsteps: 32                      # 电机细分设置,细分越高，质量越高，但主控负荷越大
full_steps_per_rotation: 200        # 单圈脉冲数 （200 为 1.8 度, 400 为 0.9 度）
nozzle_diameter: 0.400              # 喷嘴直径
filament_diameter: 1.75             # 耗材直径
heater_pin: PF7           # 加热棒引脚
sensor_type: ATC Semitec 104GT-2    # 传感器型号  (#Generic 3950, ATC Semitec 104GT-2， PT1000)
sensor_pin: PA0        # 传感器引脚,连接到 ADC_0   
min_temp: -273                      # 最小温度（注意：测量温度超过设定值会触发紧急停止）
max_temp: 350                       # 最大温度（注意：测量温度超过设定值会触发紧急停止）
max_power: 1.0                      # 最大功率
min_extrude_temp: -273                 # 最小挤出温度（至少需要达到这个温度，挤出机才能挤出）
#喷嘴温度PID校准命令：  "PID_CALIBRATE HEATER=extruder TARGET=245
#control = pid                # PID喷嘴温度自动校准项（pid校准完成后，会被注释）
#pid_kp = 26.213              # PID喷嘴温度自动校准项（pid校准完成后，会被注释）
#pid_ki = 1.304               # PID喷嘴温度自动校准项（pid校准完成后，会被注释）
#pid_kd = 131.721             # PID喷嘴温度自动校准项（pid校准完成后，会被注释）

#--------------------------------------------------------------------
[tmc2208 extruder]                  # 挤出机驱动配置
uart_pin: PG6                      # 通讯端口Pin脚定义
interpolate: False                  # 是否开启256微步插值（开启是True，关闭是False）
run_current: 0.8                    # 电机运行电流值
sense_resistor: 0.110               # 驱动采样电阻不要改
#stealthchop_threshold: 500          # 静音阀值，挤出机不建议开（如果不需要静音，请将数值改为0）

#####################################################################
#                     E1 挤出机设置 （E1 Settings）                   # 
#####################################################################

[extruder1]                         
nozzle_diameter: 0.400              # 喷嘴直径
filament_diameter: 1.75             # 耗材直径
heater_pin: PF6            # 加热棒引脚
sensor_type: ATC Semitec 104GT-2    # 传感器型号  (#Generic 3950, ATC Semitec 104GT-2， PT1000)
sensor_pin: PC1            # 传感器引脚,连接到 ADC_0   
min_temp: -273                      # 最小温度（注意：测量温度超过设定值会触发紧急停止）
max_temp: 350                       # 最大温度（注意：测量温度超过设定值会触发紧急停止）
max_power: 1.0                      # 最大功率
min_extrude_temp: 180               # 最小挤出温度（至少需要达到这个温度，挤出机才能挤出）
#喷嘴温度PID校准命令：  "PID_CALIBRATE HEATER=extruder1 TARGET=245
#control = pid                # PID喷嘴温度自动校准项（pid校准完成后，会被注释）
#pid_kp = 26.213              # PID喷嘴温度自动校准项（pid校准完成后，会被注释）
#pid_ki = 1.304               # PID喷嘴温度自动校准项（pid校准完成后，会被注释）
#pid_kd = 131.721             # PID喷嘴温度自动校准项（pid校准完成后，会被注释）

#####################################################################
#                     E2 挤出机设置 （E2 Settings）                   # 
#####################################################################

[extruder2]                         
nozzle_diameter: 0.400              # 喷嘴直径
filament_diameter: 1.75             # 耗材直径
heater_pin: PE6            # 加热棒引脚
sensor_type: ATC Semitec 104GT-2    # 传感器型号  (#Generic 3950, ATC Semitec 104GT-2， PT1000)
sensor_pin: PC0            # 传感器引脚,连接到 ADC_0   
min_temp: -273                      # 最小温度（注意：测量温度超过设定值会触发紧急停止）
max_temp: 350                       # 最大温度（注意：测量温度超过设定值会触发紧急停止）
max_power: 1.0                      # 最大功率
min_extrude_temp: 180               # 最小挤出温度（至少需要达到这个温度，挤出机才能挤出）
#喷嘴温度PID校准命令：  "PID_CALIBRATE HEATER=extruder2 TARGET=245
#control = pid                # PID喷嘴温度自动校准项（pid校准完成后，会被注释）
#pid_kp = 26.213              # PID喷嘴温度自动校准项（pid校准完成后，会被注释）
#pid_ki = 1.304               # PID喷嘴温度自动校准项（pid校准完成后，会被注释）
#pid_kd = 131.721             # PID喷嘴温度自动校准项（pid校准完成后，会被注释）

#####################################################################
#                     E3 挤出机设置 （E3 Settings）                   # 
#####################################################################

[extruder3]                         
nozzle_diameter: 0.400              # 喷嘴直径
filament_diameter: 1.75             # 耗材直径
heater_pin: PE5                    # 加热棒引脚
sensor_type: ATC Semitec 104GT-2    # 传感器型号  (#Generic 3950, ATC Semitec 104GT-2， PT1000)
sensor_pin: PF10                     # 传感器引脚,连接到 ADC_0   
min_temp: -273                      # 最小温度（注意：测量温度超过设定值会触发紧急停止）
max_temp: 350                       # 最大温度（注意：测量温度超过设定值会触发紧急停止）
max_power: 1.0                      # 最大功率
min_extrude_temp: 180               # 最小挤出温度（至少需要达到这个温度，挤出机才能挤出）
#喷嘴温度PID校准命令：  "PID_CALIBRATE HEATER=extruder3 TARGET=245
#control = pid                # PID喷嘴温度自动校准项（pid校准完成后，会被注释）
#pid_kp = 26.213              # PID喷嘴温度自动校准项（pid校准完成后，会被注释）
#pid_ki = 1.304               # PID喷嘴温度自动校准项（pid校准完成后，会被注释）
#pid_kd = 131.721             # PID喷嘴温度自动校准项（pid校准完成后，会被注释）

#####################################################################
#                            热床配置                                # 
#####################################################################

[heater_bed]
heater_pin: PE3              # 热床接口
sensor_type: Generic 3950    # 热床传感器类型
sensor_pin:  PF3             # 热床传感器接口
max_power: 1.0               # 热床功率
min_temp: -273                  # 最小温度（注意：测量温度超过设定值会触发紧急停止）
max_temp: 100                # 最大温度（注意：测量温度超过设定值会触发紧急停止）
# 热床温度PID校准命令：  "PID_CALIBRATE HEATER=heater_bed TARGET=100"
#control: pid                # PID热床温度自动校准项（pid校准完成后，会被注释）
#pid_kp: 58.437              # PID热床温度自动校准项（pid校准完成后，会被注释）
#pid_ki: 2.347               # PID热床温度自动校准项（pid校准完成后，会被注释）
#pid_kd: 363.769             # PID热床温度自动校准项（pid校准完成后，会被注释）

#####################################################################
#                            风扇配置                                # 
#####################################################################
[fan]                        # 模型冷却风扇
pin: PF8            # 信号接口
kick_start_time: 0.5         # 启动时间（勿动）
off_below: 0.10              # 勿动
#--------------------------------------------------------------------
[heater_fan hotend_fan]    
pin: PF9           # 信号接口
max_power: 1               # 最大转速
kick_start_time: 0.5         # 启动时间(勿动)
heater: extruder,extruder1,extruder2,extruder3             # 关联的设备:挤出机
heater_temp: 50              # 挤出机达到多少度启动风扇
fan_speed: 0.6               # 风扇转速
#--------------------------------------------------------------------
[heater_fan dock_fan]    
pin: PA2                     # 信号接口
max_power: 1.0               # 最大转速
kick_start_time: 0.5         # 启动时间(勿动)
heater: extruder,extruder1,extruder2,extruder3              # 关联的设备:挤出机
heater_temp: 50              # 挤出机达到多少度启动风扇
fan_speed: 1.0               # 风扇转速
#--------------------------------------------------------------------

[controller_fan driver_fan]
pin: PA1          # 【重要】请将 PA8 替换为你主板上实际的风扇引脚
max_power: 1.0    # 风扇最大功率（1.0为满速）
idle_timeout: 60  # 步进电机停机后，风扇延迟转动的时间（秒），可自己修改
# 注意：如果不指定具体的 stepper 或 heater，Klipper 会默认在“任意步进电机”或“任意加热器”工作时自动开启这个风扇。

#####################################################################
#                           调平传感器                               #
#####################################################################
[probe]
pin: PF2
x_offset: 2.88                  # X轴-传感器相对喷嘴偏移量
y_offset: 11.63                 # Y轴-传感器相对喷嘴偏移量
#z_offset: 5.07              # Z轴-传感器相对喷嘴偏移量
#PROBE_CALIBRATE （探针校准）
speed: 10                     # 调平速度
samples: 3                   # 采样次数
samples_result: median       # 取值方式（默认median-中位数）
sample_retract_dist: 3.0     # 调平回缩距离
lift_speed:8                # 离开速度
samples_tolerance: 0.005     # 采样公差（注意过小的值可能造成采样次数增加）
samples_tolerance_retries: 6 # 超公差重试次数

#####################################################################
#                               归位                                #
#####################################################################
[homing_override]
axes: z
set_position_z: 0                 
gcode:
    G91
    G1 Z10 F600   
    G90 

    # 检查 X 是否回零，如果没有则回零
    {% if "X" not in printer.toolhead.homed_axes %}
        G28 Y
        G91
        G1 Y-40 F2400
        G90
    {% endif %}
    M400
    # 检查 X 是否回零，如果没有则回零
    {% if "X" not in printer.toolhead.homed_axes %}
        G28 X
         G91
        G1 X-5 F1200
        G90
    {% endif %}

    UNTOOL  # 执行你的卸载工具宏

    # 移动到热床中间进行 Z 回零（请根据你的床尺寸调整 X150 Y150）
    G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000

    # 正式执行 Z 回零
    G28 Z

    # 归位后稍微抬升一点
    G1 Z20 F600

#####################################################################
#   3Z调平 
#####################################################################
[z_tilt]
# z_positions: 丝杠的物理坐标（旋转中心点）
# 想象一下如果喷嘴能移到丝杠的正上方，那个点的 XY 坐标是多少。
# 注意：这些点通常在打印区域之外。
z_positions:
    -10, -5           # 丝杠 1 (stepper_z) 的物理位置
    117.5, 255        # 丝杠 2 (stepper_z1) 的物理位置
    245, 10           # 丝杠 3 (stepper_z2) 的物理位置

# points: 探头去测量的坐标点（探头接触床的点）
points:
    10, 10            # 第一个测量点 (靠近左后丝杠)
    117.5, 205        # 第二个测量点 (靠近右后丝杠)
    225, 10           # 第三个测量点 (靠近中前丝杠)

speed: 400            # 测量间的移动速度
horizontal_move_z: 10 # 测量前抬升的高度
retries: 6            # 允许尝试的次数，直到达到精度
retry_tolerance: 0.01 # 精度要求
#####################################################################
#                              热床网格校准
#####################################################################
[bed_mesh]
speed: 300                   # 校准速度
horizontal_move_z: 10        # 探针前往下一个点之前Z需要抬升的高
mesh_min: 10,10              # 最小校准点坐标x，y
mesh_max: 220, 225           # 最大校准点坐标x，y
probe_count: 5,5             # 采样点数（4X4为16点）
mesh_pps: 2,2                # 补充采样点数
algorithm: bicubic           # 算法模型
bicubic_tension: 0.2         # 算法插值不要动

#####################################################################
#                              探测前释放热端
#####################################################################
[gcode_macro Z_TILT_ADJUST]
rename_existing: Z_TILT_ADJUST_BASE
gcode:
    UNTOOL        # 先确保没头
    Z_TILT_ADJUST_BASE {rawparams}  # 再执行原调平命令

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    UNTOOL        # 先确保没头
    BED_MESH_CALIBRATE_BASE {rawparams} # 再执行原调平命令
#####################################################################
#                              加速度计
#####################################################################
[lis2dw]
i2c_address: 25
# i2c_mcu: toolhead          # 如果不填，默认就是主板(mcu)
# i2c_bus: i2c3              # 如果软件I2C报错，可以解开此行注释尝试硬件I2C
i2c_speed: 400000            
i2c_software_scl_pin: PA9    # 软件I2C引脚
i2c_software_sda_pin: PA10

# 共振测试点配置
[resonance_tester]
accel_chip: lis2dw
accel_per_hz: 50
probe_points: 120, 120, 20   # 请将此处修改为您热床的正中心坐标，Z轴安全高度设为20左右

# 启用共振补偿
[input_shaper]
# 这里先保持为空。跑完测试执行 SAVE_CONFIG 后，系统会自动在文件最底部生成并保存参数。
#####################################################################
#                           自定义gcode宏                            #
#####################################################################
[gcode_macro PRINT_START]
description: 打印开始宏（包含：归零、调平、按各材料独立温度加热、智能排序划线）
gcode:
    # ==========================================
    # 1. 划线参数配置区（日常修改划线位置/速度只需改这里）
    # ==========================================
    {% set cfg_start_x = params.START_X|default(10.0)|float %}     # 划线起始点 X 坐标
    {% set cfg_start_y = params.START_Y|default(5.0)|float %}       # 划线起始点 Y 坐标
    {% set cfg_offset_y = params.OFFSET_Y|default(2.0)|float %}     # 多喷头划线时的 Y 轴偏移间距（防止多条线重叠）
    {% set cfg_length = params.LENGTH|default(50.0)|float %}        # 划线的总长度
    {% set cfg_pre_extrude = params.PRE_EXTRUDE|default(3.0)|float %} # 划线前的打底挤出量 (mm)
    {% set cfg_retract = 0 %}                                     # 划线结束后的回抽量，防止移动时拉丝 (mm)
    
    {% set cfg_speed_xy = 24000 %}                                   # XY 轴空驶移动速度 (mm/min)
    {% set cfg_speed_z = 3000 %}                                    # Z 轴抬升速度 (mm/min)
    
    # ==========================================
    # 2. 接收切片软件传来的参数（筛选出真实用到的喷头）
    # ==========================================
    {% set BED_TEMP = params.BED|default(60)|float %}               # 接收热床温度，默认 60度
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default("0")|string %} # 接收初始打印喷头序号，默认 T0
    
    {% set ns = namespace(tools="", temps="") %}
    
    # 遍历 5 个可能的喷头槽位 (T0 到 T4)
    {% for i in range(5) %}
        {% set temp_key = 'T' ~ i ~ '_TEMP' %}
        {% set used_key = 'T' ~ i ~ '_USED' %}
        
        # 定义 Klipper 中喷头的真实名称 (extruder, extruder1, extruder2...)
        {% set ext_name = "extruder" if i == 0 else "extruder" ~ i %}
        
        # 判断：确保切片传了该喷头的温度参数，且机器配置中确实有这个喷头硬件
        {% if temp_key in params and ext_name in printer.heaters.available_heaters %}
            {% set t_val = params[temp_key]|float %}
            
            # 读取切片传来的 "是否使用" 标志位（兼容 1/0 或 true/false 格式）
            {% set is_used = params[used_key]|default("1")|string|lower %}
            
            # 核心判断：温度必须大于0，且 USED 标志必须为 1 或 true，才真正加入加热列表
            {% if t_val > 0 and (is_used == "1" or is_used == "true") %}
                {% set ns.tools = ns.tools ~ i ~ "," %}
                {% set ns.temps = ns.temps ~ t_val ~ "," %}
            {% endif %}
        {% endif %}
    {% endfor %}

    # 将字符串转换为列表，去除多余的逗号
    {% set tool_list = ns.tools.strip(',').split(',') %}
    {% set temp_list = ns.temps.strip(',').split(',') %}

    # 容错兜底机制：如果上面的逻辑什么都没匹配到，强制只加热初始头到 200 度
    {% if tool_list|length == 1 and tool_list[0] == "" %}
        {% set tool_list = [INITIAL_TOOL] %}
        {% set temp_list = [200.0] %}
    {% endif %}

    # ==========================================
    # 3. 预热热床与机器归零调平
    # ==========================================
    BED_MESH_CLEAR                # 清除之前的网格床调平数据
    M140 S{BED_TEMP}              # 启动热床加热（不等待，让其后台加热）
    G28                           # 所有轴归零
    Z_TILT_ADJUST                 # Z轴双/多电机独立调平（龙门架调平）
    G28 Z                         # 调平后 Z 高度可能会变，重新归零 Z 轴
    G1 Z20 F{cfg_speed_z}         # 抬高 Z 轴，防止后续操作刮擦热床
    BED_MESH_PROFILE LOAD=default # 加载默认的网格调平数据
    M190 S{BED_TEMP}              # 等待热床加热到目标温度

    # ==========================================
    # 4. 按独立温度加热所有【用到】的喷头
    # ==========================================
    # 第一步：先用 M104 让所有需要的喷头并发加热（节省时间）
    {% for i in range(tool_list|length) %}
        {% if tool_list[i] != "" and temp_list[i] != "" %}
            M104 S{temp_list[i]} T{tool_list[i]}
        {% endif %}
    {% endfor %}

    # 第二步：用 M109 阻塞等待所有喷头达到目标温度
    {% for i in range(tool_list|length) %}
        {% if tool_list[i] != "" and temp_list[i] != "" %}
            M109 S{temp_list[i]} T{tool_list[i]}
        {% endif %}
    {% endfor %}

    # ==========================================
    # 5. 依次切换喷头并进行边缘划线
    # ==========================================
    SAVE_GCODE_STATE NAME=print_start_state  # 保存当前状态，防止宏里的操作影响切片原有的坐标系
    G90       # 切换为绝对坐标模式
    G92 E0    # 挤出机归零

    # ns_line 用于记录划了多少条线，以便计算下一条线的 Y 轴偏移量
    {% set ns_line = namespace(line_index=0) %}

    # ----- 第 5.1 步：先给【非初始头】划线 -----
    {% for tool in tool_list %}
        # 只要不是空值，且【不是初始头】，就先给它划线
        {% if tool != "" and tool != INITIAL_TOOL %}
            T{tool}   # 切换喷头
            # 计算当前喷头的 Y 轴划线位置
            {% set current_y = cfg_start_y + (ns_line.line_index * cfg_offset_y) %}
            
            G1 Z5.0 F{cfg_speed_z}                    # 抬高 Z 轴准备移动
            G1 X{cfg_start_x} Y{current_y} F{cfg_speed_xy}  # 移动到划线起始点
            G1 Z0.28 F1500                            # 下降 Z 轴到打印首层高度(约0.28)
            
            G91                                       # 切换到相对坐标模式（方便写相对挤出量）
            G1 E{cfg_pre_extrude} F300                # 划线前先原地挤出一点点，建立喷嘴压力
            G1 X{cfg_length * 0.6} E{cfg_length * 0.12} F1000 # 慢速划前 60% 的线，挤出较多材料
            G1 X{cfg_length * 0.4} E{cfg_length * 0.05} F1500 # 快速划后 40% 的线，逐渐减少挤出变细
            G1 E-{cfg_retract} F2100                  # 划线完毕，回抽一点防止拉丝 (已修复原代码 G1 E0 的bug)
            G1 Z2.0 F{cfg_speed_z}                    # 划线结束，稍微抬升喷头
            
            G90                                       # 恢复绝对坐标
            G92 E0                                    # 挤出机清零
            M104 S0 T{tool}                           # 划线完毕后，【关闭非初始头的加热】，防止其在旁边空闲时漏料滴料！
            {% set ns_line.line_index = ns_line.line_index + 1 %}
        {% endif %}
    {% endfor %}

    # ----- 第 5.2 步：最后给【初始头】划线 -----
    # 确保切片传来的初始头确实在用到的列表里，最后拿起它划线，划完直接去打印
    {% if INITIAL_TOOL in tool_list %}
        T{INITIAL_TOOL} # 切换回首层真正要打印的喷头
        {% set current_y = cfg_start_y + (ns_line.line_index * cfg_offset_y) %}
        
        G1 Z5.0 F{cfg_speed_z}
        G1 X{cfg_start_x} Y{current_y} F{cfg_speed_xy}
        G1 Z0.28 F1500
        
        G91
        G1 E{cfg_pre_extrude} F300 
        G1 X{cfg_length * 0.6} E{cfg_length * 0.12} F1000 
        G1 X{cfg_length * 0.4} E{cfg_length * 0.05} F1500 
        G1 E-{cfg_retract} F2100                  # 修复的回抽指令
        G1 Z2.0 F{cfg_speed_z}
        
        G90
        G92 E0
        # 此时初始头已经就绪，温度正常，且刚划完线，状态完美
    {% endif %}

    # ==========================================
    # 6. 恢复状态并应用工具头偏移（交接给切片）
    # ==========================================
    RESTORE_GCODE_STATE NAME=print_start_state # 恢复宏调用之前的状态坐标系
    
    # 针对双头/多头机器，重新应用保存在 variables.cfg 中的首层喷嘴偏移补偿
    {% if INITIAL_TOOL in tool_list %}
        {% set svv = printer.save_variables.variables %}
        {% set off_x = svv["t" ~ INITIAL_TOOL ~ "_offset_x"] | default(0.0) | float %}
        {% set off_y = svv["t" ~ INITIAL_TOOL ~ "_offset_y"] | default(0.0) | float %}
        {% set off_z = svv["t" ~ INITIAL_TOOL ~ "_offset_z"] | default(0.0) | float %}
        
        SET_GCODE_OFFSET X={off_x} Y={off_y} Z={off_z} MOVE=0
        
        { action_respond_info("初始头 T" ~ INITIAL_TOOL ~ " 已从外部文件应用偏移: X=" ~ off_x ~ " Y=" ~ off_y ~ " Z=" ~ off_z) }
    {% endif %}

    { action_respond_info("划线结束。当前喷头为 T" ~ INITIAL_TOOL ~ "，准备直接打印！") }
#--------------------------------------------------------------------
[gcode_macro PRINT_END]
description: 打印结束宏：卸载工具、关闭加热、热床降到底部方便取模
gcode:
    # 1. 获取机器定义的范围
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    
    # 2. 卸载工具头并重置偏移量
    UNTOOL
    SET_GCODE_OFFSET X=0 Y=0 Z=0 

    M400                              # 等待缓冲区清除
    G92 E0                            # 将挤出机计数归零
    
    # 3. 先进行安全小抬升 (相对坐标)
    G91                               # 相对定位
    # 向上抬升 5mm (如果没超过最大高度的话)
    {% if printer.toolhead.position.z < (max_z - 5) %}
        G0 Z5 F3600 
    {% endif %}
    
    # 4. 关闭所有加热源和风扇
    M104 S0 T0                        
    M104 S0 T1                        
    M104 S0 T2                        
    M104 S0 T3                        
    M140 S0                           # 关闭热床
    M106 S0                           # 关闭模型风扇
    
    # 5. 执行“取模位”移动 (绝对坐标)
    G90                               # 切换回绝对坐标
    {% set safe_z = max_z - 10 %}
    
    G0 X{max_x-5} Y{max_y-5} Z{safe_z} F6000
    
    # 6. 后期处理
    M400                              # 等待移动完成
    BED_MESH_CLEAR                    # 卸载网床
    # M84                             # 可选：如果你想手动取模更轻松，可以取消注释这行关闭电机
    
    { action_respond_info("打印完成！热床已降下，请取模。") }

