#####################################################################
#                     Machine type and acceleration                 #
#####################################################################
[printer]                       # Printer settings
kinematics: corexy              # Kinematics types include Cartesian, corexy, etc. Cartesian: cartesian
max_velocity: 400               # Printer maximum speed   
max_accel: 20000                 # Maximum acceleration 
max_z_velocity: 30              # Z-axis maximum speed
max_z_accel: 300                # Z-axis maximum acceleration
square_corner_velocity: 5.0     # Square corner velocity; a smaller value helps counter inertia from a heavy bed
#####################################################################
#                        Temperature monitoring                     #
#####################################################################
