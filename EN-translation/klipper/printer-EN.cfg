rotation_distance: 8          # Lead screw pitch is 8; change this to match your actual hardware; there are 3 places to change in total
full_steps_per_rotation: 200  # Pulses per motor revolution (1.8-degree motor: 200, 0.9-degree motor: 400)
microsteps: 32                # Motor microstep setting; higher microstepping gives higher quality but more MCU load
endstop_pin: probe:z_virtual_endstop            # Limit switch pin; recommended normally closed then add "!" to invert; located at io-1
position_min: -10             # Z-axis minimum travel (around -5 is needed if configuring nozzle cleaning)
position_max: 200             # Z-axis maximum travel (250mm-300mm-350mm)
homing_speed: 10               # Homing speed - maximum 20
second_homing_speed: 3        # Second homing speed - maximum 10
homing_retract_dist: 3        # Retract distance
#--------------------------------------------------------------------
[tmc2208 stepper_z]
uart_pin: PD5                 # Driver communication port
interpolate: false            # 256-microstep interpolation
run_current: 0.8              # Run current mA
