sensor_type: temperature_mcu   

[temperature_sensor FLY-Pi]
sensor_type: temperature_host
#####################################################################
#             X/Y Stepper Settings                                  # 
#####################################################################
#   B Motor ---- Motor A 
#   |                  |
#   |-----extruder-----|
#   |                  |
#   |                  |
#          front   
#####################################################################
#                     X-axis stepper motor (B motor)                #
#####################################################################
## X motor port
[stepper_x]
step_pin: PB9                       # X-axis motor step pin
dir_pin: PE0                        # X-axis motor direction pin; determine direction by testing; adding "!" reverses the direction
enable_pin: !PE1                    # X-axis motor enable pin; the enable pin needs "!", otherwise the motor won't work
rotation_distance: 40               # Drive pulley circumference in mm (2GT-20T pulley: 40, 2GT-16T pulley: 32)
microsteps: 32                      # Motor microstep setting; higher microstepping gives higher quality but more MCU load
full_steps_per_rotation: 200        # Pulses per motor revolution (1.8-degree motor: 200, 0.9-degree motor: 400)
endstop_pin: PC3                   # Limit switch pin; recommended normally closed then add "!" to invert; located at io-3
###When wired normally closed it reads as triggered; adding "!" inverts this so a broken wire won't crash the machine
position_min: -5                     # Soft limit minimum travel
position_endstop: 240               # Soft limit maximum travel (250mm-300mm-350mm)
position_max: 240                   # Mechanical limit maximum travel (250mm-300mm-350mm)
homing_speed: 80                    # Homing speed, maximum 100. It's best not to home too fast
homing_retract_dist: 0              # Back-off distance after first triggering the homing switch
#--------------------------------------------------------------------
##  Make sure the driver model is configured correctly (2208 or 2209)
[tmc2209 stepper_x]                 # X driver configuration - TMC2209
uart_pin: PG13                      # Communication port pin definition
interpolate: False                  # Whether to enable 256-microstep interpolation (True to enable, False to disable)
run_current: 1.1                    # Run current
sense_resistor: 0.110               # Driver sense resistor; do not change
#####################################################################
#                     Y-axis stepper motor (A motor)                #
#####################################################################
## Y motor port
[stepper_y]
step_pin: PB8                       # Y-axis motor step pin
dir_pin: PG11                       # Y-axis motor direction pin; determine direction by testing; adding "!" reverses the direction
enable_pin: !PG12                   # Y-axis motor enable pin; the enable pin needs "!", otherwise the motor won't work
rotation_distance: 40               # Drive pulley circumference in mm (2GT-20T pulley: 40, 2GT-16T pulley: 32)
microsteps: 32                      # Motor microstep setting; higher microstepping gives higher quality but more MCU load
full_steps_per_rotation: 200        # Pulses per motor revolution (1.8-degree motor: 200, 0.9-degree motor: 400)
endstop_pin: PC2                   # Limit switch pin; recommended normally closed then add "!" to invert; located at io-0
###When wired normally closed it reads as triggered; adding "!" inverts this so a broken wire won't crash the machine
position_min: -33                     # Soft limit minimum travel
position_endstop: 230               # Soft limit maximum travel (250mm-300mm-350mm)
position_max: 230                   # Mechanical limit maximum travel (250mm-300mm-350mm)
homing_speed: 80                    # Homing speed, maximum 100        It's best not to home too fast
homing_retract_dist: 0              # Back-off distance after first triggering the homing switch
#--------------------------------------------------------------------
##  Make sure the driver model is configured correctly (2208 or 2209)
[tmc2209 stepper_y]                 # Y driver configuration - TMC2209
uart_pin: PG10                      # Communication port pin definition
interpolate: False                  # Whether to enable 256-microstep interpolation (True to enable, False to disable)
run_current: 1.1                    # Run current
sense_resistor: 0.110               # Driver sense resistor; do not change
#--------------------------------------------------------------------
#[tmc5160 stepper_y]                 # Extruder driver configuration - TMC5160
#cs_pin: PG10                        # SPI chip-select pin definition
#spi_bus: spi2                      # SPI communication bus definition
#run_current: 1.0                    # Motor run current
#interpolate: False                  # Whether to enable 256-microstep interpolation (True to enable, False to disable)
#sense_resistor: 0.075              # Driver sense resistor; do not change (if using 5160 Pro, change the value to 0.033)

#####################################################################
#                     Z Stepper Settings                            #
#####################################################################
#   |----- Z1 -----|
#   |              |
#   |              |
#   |              |
#   Z0---display---Z2

#####################################################################
#                        Z-axis stepper motor                       #
#####################################################################
##    Z stepper motor - front left, z port

[stepper_z]
