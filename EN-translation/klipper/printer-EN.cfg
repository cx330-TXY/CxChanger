[respond]          # Required: enables M118 message output
[pause_resume]     # Required: enables pause/resume functionality
[display_status]   # Recommended: shows status in the UI
[virtual_sdcard]
path: /usr/share/printer_data/gcodes

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # ----- Parameter settings -----
    {% set z_hop = 5.0 %}           ; Lift height on pause (mm)
    {% set x_park = 10.0 %}         ; Park position X coordinate
    {% set y_park = 10.0 %}         ; Park position Y coordinate
    {% set retract_len = 0 %}     ; Retraction length on pause (mm)
    
    # 1. Save the current G-code state (coordinates, extrusion mode, offsets, etc.)
    SAVE_GCODE_STATE NAME=PAUSE_state
    
    # 2. Execute the base pause command
    BASE_PAUSE
    
    # 3. Safe retraction and lift
    {% if printer.extruder.can_extrude %}
        M83                          ; Relative extrusion mode
        G1 E-{retract_len} F2100     ; Retract slightly to prevent dripping
    {% endif %}
    
    # 4. Calculate the Z lift height (avoid hitting the top limit)
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% if cur_z < (max_z - z_hop) %}
        {% set z_safe = z_hop %}
    {% else %}
        {% set z_safe = max_z - cur_z %}
    {% endif %}

    G91                              ; Relative coordinate mode
    G1 Z{z_safe} F900                ; Lift Z away from the model surface
    
    # 5. Move to the side park position
    G90                              ; Absolute coordinate mode
    G1 X{x_park} Y{y_park} F18000    ; Move quickly to the side
    
    M118 [System] Parked safely; waiting for manual intervention...

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% set retract_len = 0 %}      ; Must match the retraction amount in PAUSE
    
    # 1. Check that the extruder temperature is sufficient to prevent cold extrusion
    {% if printer.extruder.can_extrude %}
        M83
        G1 E{retract_len} F2100      ; Re-prime the filament retracted earlier
    {% endif %}
    
    # 2. Restore the saved state (automatically returns to the pre-pause position and restores speed limits)
    # MOVE=1 makes the machine automatically move back to the pre-pause X Y Z position
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=150
    
    M118 [System] Preparing to resume printing...
    BASE_RESUME
    
[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  G91
  G1 Z10 F600 ; Lift the nozzle 10mm to avoid scorching the model
  UNTOOL
  M106 S0
[force_move]
enable_force_move: True
