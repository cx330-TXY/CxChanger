#####################################################################
#                          Fan configuration                        # 
#####################################################################
[fan]                        # Part cooling fan
pin: PF8            # Signal port
kick_start_time: 0.5         # Kick-start time (do not change)
off_below: 0.10              # Do not change
#--------------------------------------------------------------------
[heater_fan hotend_fan]    
pin: PA2           # Signal port
max_power: 1               # Maximum speed
kick_start_time: 0.5         # Kick-start time (do not change)
heater: extruder,extruder1,extruder2,extruder3             # Associated devices: extruders
heater_temp: 50              # Extruder temperature at which the fan starts
fan_speed: 0.8               # Fan speed
#--------------------------------------------------------------------
[heater_fan dock_fan]    
pin: PE13                     # Signal port
max_power: 1.0               # Maximum speed
kick_start_time: 0.5         # Kick-start time (do not change)
heater: extruder,extruder1,extruder2,extruder3              # Associated devices: extruders
heater_temp: 50              # Extruder temperature at which the fan starts
fan_speed: 1.0               # Fan speed
#--------------------------------------------------------------------

[controller_fan driver_fan]
pin: PA1          # [Important] Replace PA8 with the actual fan pin on your board
max_power: 0.7    # Fan maximum power (1.0 is full speed)
idle_timeout: 60  # Time (seconds) the fan keeps spinning after the steppers stop; adjust as desired
# Note: if no specific stepper or heater is specified, Klipper defaults to turning this fan on whenever "any stepper" or "any heater" is active.

#####################################################################
#                          Leveling probe                           #
#####################################################################
[probe]
pin: PF2
x_offset: 2.88                  # X-axis sensor offset relative to the nozzle
y_offset: 11.63                 # Y-axis sensor offset relative to the nozzle
#z_offset: 5.07              # Z-axis sensor offset relative to the nozzle
#PROBE_CALIBRATE (probe calibration)
speed: 8                     # Probing speed
samples: 3                   # Number of samples
samples_result: median       # Sampling method (default median)
sample_retract_dist: 3.0     # Probe retract distance
lift_speed:8                # Lift-off speed
samples_tolerance: 0.005     # Sampling tolerance (note: too small a value may increase the number of samples)
samples_tolerance_retries: 6 # Retry count when tolerance is exceeded

#####################################################################
#                               Homing                              #
#####################################################################
[homing_override]
axes: z
set_position_z: 0                 
gcode:
    G91
    G1 Z10 F600   
    G90 

    # Check whether X is homed; if not, home it
    {% if "X" not in printer.toolhead.homed_axes %}
        G28 Y
        G91
        G1 Y-100 F9000
        G90
    {% endif %}
    M400
    # Check whether X is homed; if not, home it
    {% if "X" not in printer.toolhead.homed_axes %}
        G28 X
         G91
        G1 X-20 F9000
        G90
    {% endif %}

    UNTOOL  # Run your tool-unload macro

    # Move to the middle of the bed for Z homing (adjust X150 Y150 to your bed size)
    G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000

    # Perform the actual Z homing
    G28 Z

    # Lift slightly after homing
    G1 Z20 F600

#####################################################################
#   3-Z leveling 
#####################################################################
[z_tilt]
# z_positions: the physical coordinates of the lead screws (pivot points)
# Imagine the XY coordinates the nozzle would have if it could move directly above each lead screw.
# Note: these points are usually outside the print area.
z_positions:
    -10, -5           # Physical position of lead screw 1 (stepper_z)
    117.5, 255        # Physical position of lead screw 2 (stepper_z1)
    245, 10           # Physical position of lead screw 3 (stepper_z2)

# points: the coordinates the probe measures (where the probe touches the bed)
points:
    10, 10            # First measurement point (near the rear-left lead screw)
    117.5, 205        # Second measurement point (near the rear-right lead screw)
    225, 10           # Third measurement point (near the front-center lead screw)

speed: 400            # Travel speed between measurements
horizontal_move_z: 10 # Lift height before measuring
retries: 6            # Number of retries allowed until accuracy is reached
retry_tolerance: 0.01 # Accuracy requirement
#####################################################################
#                        Bed mesh calibration
#####################################################################
[bed_mesh]
speed: 300                   # Calibration speed
horizontal_move_z: 10        # Z lift height before the probe moves to the next point
mesh_min: 10,15              # Minimum calibration point coordinates x, y
mesh_max: 220, 225           # Maximum calibration point coordinates x, y
probe_count: 5,5             # Number of sample points (4x4 is 16 points)
mesh_pps: 2,2                # Additional interpolated sample points
algorithm: bicubic           # Algorithm model
bicubic_tension: 0.2         # Algorithm interpolation; do not change

#####################################################################
#                 Release the hotend before probing
#####################################################################
[gcode_macro Z_TILT_ADJUST]
rename_existing: Z_TILT_ADJUST_BASE
gcode:
    UNTOOL        # First make sure no tool head is attached
    Z_TILT_ADJUST_BASE {rawparams}  # Then run the original leveling command

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    UNTOOL        # First make sure no tool head is attached
    BED_MESH_CALIBRATE_BASE {rawparams} # Then run the original leveling command
#####################################################################
#                           Accelerometer
#####################################################################
[lis2dw]
i2c_address: 25
# i2c_mcu: toolhead          # If not set, defaults to the main board (mcu)
# i2c_bus: i2c3              # If software I2C errors out, uncomment this line to try hardware I2C
i2c_speed: 400000            
i2c_software_scl_pin: PA9    # Software I2C pins
i2c_software_sda_pin: PA10

# Resonance test point configuration
[resonance_tester]
accel_chip: lis2dw
accel_per_hz: 50
probe_points: 120, 120, 20   # Change this to the exact center of your bed, with a safe Z height of about 20

# Enable resonance compensation
[input_shaper]
# Leave this empty for now. After running the test and executing SAVE_CONFIG, the system automatically generates and saves the parameters at the very bottom of the file.
#####################################################################
#                        Custom G-code macros                       #
#####################################################################
[gcode_macro PRINT_START]
description: Print start macro (includes: homing, leveling, heating each material to its own temperature, smart-ordered priming lines)
gcode:
    # ==========================================
    # 1. Priming line parameter section (for day-to-day changes to line position/speed, edit only here)
    # ==========================================
    {% set cfg_start_x = params.START_X|default(10.0)|float %}     # Priming line start point X coordinate
    {% set cfg_start_y = params.START_Y|default(5.0)|float %}       # Priming line start point Y coordinate
    {% set cfg_offset_y = params.OFFSET_Y|default(2.0)|float %}     # Y-axis offset spacing when priming with multiple heads (prevents lines from overlapping)
    {% set cfg_length = params.LENGTH|default(50.0)|float %}        # Total length of the priming line
    {% set cfg_pre_extrude = params.PRE_EXTRUDE|default(3.0)|float %} # Base extrusion amount before drawing the line (mm)
    {% set cfg_retract = 0 %}                                     # Retraction after the line to prevent stringing during travel (mm)
    
    {% set cfg_speed_xy = 24000 %}                                   # XY travel speed (mm/min)
    {% set cfg_speed_z = 3000 %}                                    # Z lift speed (mm/min)
    
    # ==========================================
    # 2. Receive parameters from the slicer (filter to the heads actually used)
    # ==========================================
    {% set BED_TEMP = params.BED|default(60)|float %}               # Receive bed temperature, default 60 degrees
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default("0")|string %} # Receive initial print head index, default T0
    
    {% set ns = namespace(tools="", temps="") %}
    
    # Iterate over the 5 possible head slots (T0 to T4)
    {% for i in range(5) %}
        {% set temp_key = 'T' ~ i ~ '_TEMP' %}
        {% set used_key = 'T' ~ i ~ '_USED' %}
        
        # Define the head's actual name in Klipper (extruder, extruder1, extruder2...)
        {% set ext_name = "extruder" if i == 0 else "extruder" ~ i %}
        
        # Check: make sure the slicer passed a temperature for this head, and that this head's hardware actually exists in the machine configuration
        {% if temp_key in params and ext_name in printer.heaters.available_heaters %}
            {% set t_val = params[temp_key]|float %}
            
            # Read the "used" flag passed by the slicer (accepts 1/0 or true/false formats)
            {% set is_used = params[used_key]|default("1")|string|lower %}
            
            # Core check: the temperature must be greater than 0 and the USED flag must be 1 or true for the head to be added to the heating list
            {% if t_val > 0 and (is_used == "1" or is_used == "true") %}
                {% set ns.tools = ns.tools ~ i ~ "," %}
                {% set ns.temps = ns.temps ~ t_val ~ "," %}
            {% endif %}
        {% endif %}
    {% endfor %}

    # Convert the strings to lists and remove extra commas
    {% set tool_list = ns.tools.strip(',').split(',') %}
    {% set temp_list = ns.temps.strip(',').split(',') %}

    # Fallback mechanism: if the logic above matched nothing, force heating only the initial head to 200 degrees
    {% if tool_list|length == 1 and tool_list[0] == "" %}
        {% set tool_list = [INITIAL_TOOL] %}
        {% set temp_list = [200.0] %}
    {% endif %}

    # ==========================================
    # 3. Preheat the bed and home/level the machine
    # ==========================================
    BED_MESH_CLEAR                # Clear previous bed mesh data
    M140 S{BED_TEMP}              # Start bed heating (no wait; let it heat in the background)
    G28                           # Home all axes
    Z_TILT_ADJUST                 # Independent Z multi-motor leveling (gantry leveling)
    G28 Z                         # The Z height may change after leveling, so re-home Z
    G1 Z20 F{cfg_speed_z}         # Raise Z to prevent scraping the bed during subsequent operations
    BED_MESH_PROFILE LOAD=default # Load the default bed mesh data
    M190 S{BED_TEMP}              # Wait for the bed to reach the target temperature

    # ==========================================
    # 4. Heat all [used] heads to their individual temperatures
    # ==========================================
    # Step one: use M104 to heat all needed heads concurrently (saves time)
    {% for i in range(tool_list|length) %}
        {% if tool_list[i] != "" and temp_list[i] != "" %}
            M104 S{temp_list[i]} T{tool_list[i]}
        {% endif %}
    {% endfor %}

    # Step two: use M109 to block until all heads reach their target temperatures
    {% for i in range(tool_list|length) %}
        {% if tool_list[i] != "" and temp_list[i] != "" %}
            M109 S{temp_list[i]} T{tool_list[i]}
        {% endif %}
    {% endfor %}

    # ==========================================
    # 5. Switch heads in order and draw priming lines at the edge
    # ==========================================
    SAVE_GCODE_STATE NAME=print_start_state  # Save the current state so operations in the macro do not affect the slicer's coordinate system
    G90       # Switch to absolute coordinate mode
    G92 E0    # Reset the extruder

    # ns_line records how many lines were drawn, to compute the Y offset for the next line
    {% set ns_line = namespace(line_index=0) %}

    # ----- Step 5.1: prime the [non-initial heads] first -----
    {% for tool in tool_list %}
        # As long as it is not empty and [not the initial head], prime it first
        {% if tool != "" and tool != INITIAL_TOOL %}
            T{tool}   # Switch head
            # Compute the Y priming-line position for the current head
            {% set current_y = cfg_start_y + (ns_line.line_index * cfg_offset_y) %}
            
            G1 Z5.0 F{cfg_speed_z}                    # Raise Z to prepare for the move
            G1 X{cfg_start_x} Y{current_y} F{cfg_speed_xy}  # Move to the priming line start point
            G1 Z0.28 F1500                            # Lower Z to first-layer height (about 0.28)
            
            G91                                       # Switch to relative coordinate mode (easier to write relative extrusion amounts)
            G1 E{cfg_pre_extrude} F300                # Extrude a little in place before the line to build nozzle pressure
            G1 X{cfg_length * 0.6} E{cfg_length * 0.12} F1000 # Draw the first 60% of the line slowly, extruding more material
            G1 X{cfg_length * 0.4} E{cfg_length * 0.05} F1500 # Draw the last 40% quickly, gradually tapering extrusion
            G1 E-{cfg_retract} F2100                  # Line done; retract slightly to prevent stringing (fixes the original G1 E0 bug)
            G1 Z2.0 F{cfg_speed_z}                    # Line finished; lift the head slightly
            
            G90                                       # Restore absolute coordinates
            G92 E0                                    # Reset the extruder
            M104 S0 T{tool}                           # After priming, [turn off heating of the non-initial head] to prevent it from oozing while idle nearby!
            {% set ns_line.line_index = ns_line.line_index + 1 %}
        {% endif %}
    {% endfor %}

    # ----- Step 5.2: prime the [initial head] last -----
    # Make sure the initial head from the slicer is actually in the used list; pick it up last, prime it, and go straight to printing
    {% if INITIAL_TOOL in tool_list %}
        T{INITIAL_TOOL} # Switch back to the head that actually prints the first layer
        {% set current_y = cfg_start_y + (ns_line.line_index * cfg_offset_y) %}
        
        G1 Z5.0 F{cfg_speed_z}
        G1 X{cfg_start_x} Y{current_y} F{cfg_speed_xy}
        G1 Z0.28 F1500
        
        G91
        G1 E{cfg_pre_extrude} F300 
        G1 X{cfg_length * 0.6} E{cfg_length * 0.12} F1000 
        G1 X{cfg_length * 0.4} E{cfg_length * 0.05} F1500 
        G1 E-{cfg_retract} F2100                  # Fixed retraction command
        G1 Z2.0 F{cfg_speed_z}
        
        G90
        G92 E0
        # At this point the initial head is ready, at temperature, and freshly primed - in perfect condition
    {% endif %}

    # ==========================================
    # 6. Restore state and apply the tool head offset (hand off to the slicer)
    # ==========================================
    RESTORE_GCODE_STATE NAME=print_start_state # Restore the coordinate-system state from before the macro was called
    
    # For dual/multi-head machines, re-apply the first-layer nozzle offset compensation saved in variables.cfg
    {% if INITIAL_TOOL in tool_list %}
        {% set svv = printer.save_variables.variables %}
        {% set off_x = svv["t" ~ INITIAL_TOOL ~ "_offset_x"] | default(0.0) | float %}
        {% set off_y = svv["t" ~ INITIAL_TOOL ~ "_offset_y"] | default(0.0) | float %}
        {% set off_z = svv["t" ~ INITIAL_TOOL ~ "_offset_z"] | default(0.0) | float %}
        
        SET_GCODE_OFFSET X={off_x} Y={off_y} Z={off_z} MOVE=0
        
        { action_respond_info("Initial head T" ~ INITIAL_TOOL ~ " applied offsets from external file: X=" ~ off_x ~ " Y=" ~ off_y ~ " Z=" ~ off_z) }
    {% endif %}

    { action_respond_info("Priming complete. Current head is T" ~ INITIAL_TOOL ~ ", ready to print directly!") }
#--------------------------------------------------------------------
[gcode_macro PRINT_END]
description: Print end macro - unload the tool, turn off heating, lower the bed for easy part removal
gcode:
    # 1. Get the machine-defined limits
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    
    # 2. Unload the tool head and reset offsets
    UNTOOL
    SET_GCODE_OFFSET X=0 Y=0 Z=0 

    M400                              # Wait for the buffer to clear
    G92 E0                            # Zero the extruder counter
    
    # 3. First do a small safe lift (relative coordinates)
    G91                               # Relative positioning
    # Lift 5mm (as long as it doesn't exceed the maximum height)
    {% if printer.toolhead.position.z < (max_z - 5) %}
        G0 Z5 F3600 
    {% endif %}
    
    # 4. Turn off all heat sources and fans
    M104 S0 T0                        
    M104 S0 T1                        
    M104 S0 T2                        
    M104 S0 T3                        
    M140 S0                           # Turn off the heated bed
    M106 S0                           # Turn off the part cooling fan
    
    # 5. Move to the "part removal position" (absolute coordinates)
    G90                               # Switch back to absolute coordinates
    {% set safe_z = max_z - 30 %}
    
    G0 X{max_x-5} Y{max_y-5} Z{safe_z} F6000
    
    # 6. Post-processing
    M400                              # Wait for the move to finish
    BED_MESH_CLEAR                    # Unload the bed mesh
    # M84                             # Optional: uncomment this line to disable the motors for easier manual part removal
    
    { action_respond_info("Print complete! The bed has been lowered; please remove the part.") }

