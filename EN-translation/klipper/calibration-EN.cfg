[tools_calibrate]
pin: ^PD11        # Calibration probe pin
travel_speed: 15  # Probing travel speed
spread: 4.5         # Probing spread
lower_z: 0.6      # Press-down distance (test to find a suitable value; it seems to affect calibration quality)
speed: 2          # Retract speed between each probe trigger (mm/s)
lift_speed: 4     # Z lift speed after probing completes. Note: the configured lift height must be greater than the physical Z height difference between tool heads
final_lift_z: 1   # Final safe Z lift height after probing is complete
sample_retract_dist: 2  # Retract distance after each probe (mm)
samples_tolerance: 0.1 # Tolerance range for multiple probe results; exceeding it retries or errors out
samples: 5              # Number of probe samples
samples_result: median  # How sample results are computed: median or average

[gcode_macro _TOOL_CALIB_VARS]
variable_sensor_x: 112.5      # Center X coordinate of the calibration sensor
variable_sensor_y: -4      # Center Y coordinate of the calibration sensor
variable_safe_x: 112         # Safe area X for tool change / standby
variable_safe_y: 10.0         # Safe area Y for tool change / standby
variable_safe_z: 10.0         # Safe area Z height for tool change / standby
variable_tool_count: 4       # Total number of tools (e.g. 0, 1 = 2 tools)
gcode:
    # No commands needed here; used only to store variables
# ---------------------------------------------------------
# Calibrate a single tool
# Example: CALIBRATE_TOOL TOOL=1
# ---------------------------------------------------------
[gcode_macro CALIBRATE_TOOL]
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set vars = printer["gcode_macro _TOOL_CALIB_VARS"] %}
    
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    T{tool}
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    G1 X{vars.sensor_x} Y{vars.sensor_y} F9000
    
    {% if tool == 0 %}
        {action_respond_info("Calibrating T0 reference point...")}
        TOOL_LOCATE_SENSOR
        M400                  # [Critical] Wait for the probing motion to fully complete
        G4 P500               # [Critical] Pause 0.5 s to let the system process the coordinate reset
        _DO_SAVE_CALIB_RESULT TOOL=0
    {% else %}
        {action_respond_info("Calibrating offset for T" ~ tool ~ "...")}
        TOOL_CALIBRATE_TOOL_OFFSET
        M400                  # [Critical] Wait for the motion to complete
        _DO_SAVE_CALIB_RESULT TOOL={tool}
    {% endif %}

    M400
    G90
    G1 Z{vars.safe_z} F600    # Lift Z alone first after probing
    G1 X{vars.safe_x} Y{vars.safe_y} F9000
    UNTOOL

[gcode_macro _DO_SAVE_CALIB_RESULT]
gcode:
    {% set tool = params.TOOL|int %}
    {% set res = printer.tools_calibrate.last_result %}
    
    {% if tool == 0 %}
        # T0 always stores 0
        SAVE_VARIABLE VARIABLE=t0_offset_x VALUE=0.0
        SAVE_VARIABLE VARIABLE=t0_offset_y VALUE=0.0
        SAVE_VARIABLE VARIABLE=t0_offset_z VALUE=0.0
        {action_respond_info("✅ T0 reference point coordinates locked")}
    {% else %}
        # Other tools store the probe result
        SAVE_VARIABLE VARIABLE=t{tool}_offset_x VALUE={res[0]|round(6)}
        SAVE_VARIABLE VARIABLE=t{tool}_offset_y VALUE={res[1]|round(6)}
        SAVE_VARIABLE VARIABLE=t{tool}_offset_z VALUE={res[2]|round(6)}
        {action_respond_info("✅ T" ~ tool ~ " offset saved automatically")}
    {% endif %}
# ---------------------------------------------------------
# Calibrate all tools in batch
# ---------------------------------------------------------
[gcode_macro CALIBRATE_ALL_TOOLS]
gcode:
    {% set vars = printer["gcode_macro _TOOL_CALIB_VARS"] %}
    
    {action_respond_info("Starting fully automatic tool calibration sequence...")}
    
    # Iterate over all tools (range(0, N) generates 0 to N-1)
    {% for t in range(0, vars.tool_count) %}
        CALIBRATE_TOOL TOOL={t}
    {% endfor %}
    
    {action_respond_info("All tools calibrated")}
